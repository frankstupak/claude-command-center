name: Bug report
description: Something in Claude Command Center is broken
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. Ubuntu 24.04
    validations:
      required: true
