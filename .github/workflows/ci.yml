name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: syntax check
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: build (unpacked)
        run: npx electron-builder --dir --linux
